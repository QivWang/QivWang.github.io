<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thesis Booklet | Qiv Wang</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #000;
    }

    #pdf-container {
      width: 100%;
      background: #fff;
    }

    .pdf-page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }

    .video-section {
      width: 100%;
      min-height: 100vh;
      background: #000;

      display: flex;
      align-items: center;
      justify-content: center;

      box-sizing: border-box;
      padding: 40px;
    }

    .video-section video {
      width: 100%;
      max-width: 1600px;
      max-height: 95vh;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <!-- PDF pages will appear here -->
  <div id="pdf-container"></div>

  <!-- Fog -->
  <section class="video-section">
    <video controls playsinline>
      <source src="Fog.MP4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>

  <!-- Projector -->
  <section class="video-section">
    <video controls playsinline>
      <source src="Projector.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>


  <script type="module">

    import * as pdfjsLib
      from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";

    const pdfUrl = "thesis-booklet.pdf";

    const pdf = await pdfjsLib.getDocument(pdfUrl).promise;

    const container =
      document.getElementById("pdf-container");


    for (let pageNumber = 1;
         pageNumber <= pdf.numPages;
         pageNumber++) {

      const page =
        await pdf.getPage(pageNumber);

      const viewport =
        page.getViewport({ scale: 2 });

      const canvas =
        document.createElement("canvas");

      canvas.className = "pdf-page";

      const context =
        canvas.getContext("2d");

      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;

      container.appendChild(canvas);

      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;
    }

  </script>

</body>
</html>
